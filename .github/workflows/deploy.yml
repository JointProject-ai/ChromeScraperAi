name: Manual Flask Deploy

on:
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 📂 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 🛠️ Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r backend/requirements.txt

      - name: 🧪 Run Flask app (test only)
        run: |
          source venv/bin/activate
          python backend/src/app.py &
          sleep 10
          curl http://localhost:8081 || true

      # - name: 🚀 Deploy via Render API (optional)
      #   run: |
      #     curl -X POST https://api.render.com/deploy/srv-xxxxxxxxxxxxx \
      #       -H 'Authorization: Bearer ${{ secrets.RENDER_API_KEY }}'

      # OR deploy via SSH to a remote server
      # - name: 🔐 Copy files to server
      #   run: |
      #     scp -r . user@your-server.com:/path/to/project
      #     ssh user@your-server.com 'cd /path/to/project && ./deploy.sh'