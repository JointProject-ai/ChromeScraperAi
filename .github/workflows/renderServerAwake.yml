name: Keep Render Service Alive and Notify on Failure

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        id: ping
        continue-on-error: true
        run: |
          echo "Pinging https://pagewise-hbie.onrender.com/"
          curl --fail --silent --show-error https://pagewise-hbie.onrender.com/
    
      - name: Send email if ping failed
        if: steps.ping.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔴 Render App Down - Ping Failed"
          to: jointproject.ai@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ❌ Render ping failed for https://pagewise-hbie.onrender.com

            GitHub Action Log:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
